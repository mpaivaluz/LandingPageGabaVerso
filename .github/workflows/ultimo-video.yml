name: Último vídeo

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" pra rodar na hora

permissions:
  contents: write

concurrency:
  group: ultimo-video
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar feed do YouTube
        run: python3 .github/scripts/ultimo_video.py

      - name: Salvar se mudou
        run: |
          git add ultimo-video.json
          if git diff --cached --quiet; then
            echo "Sem vídeo novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza último vídeo"
          git push
